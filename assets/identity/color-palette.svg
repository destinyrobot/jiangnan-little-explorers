<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-label="江南小小探索家 色彩系统">
  <title>色彩系统 / Color Palette</title>
  <rect width="960" height="500" fill="#FFFFFF"/>
  <text x="40" y="52" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700"
        letter-spacing="3.4" fill="#2E7D77">COLOR PALETTE</text>
  <text x="40" y="88" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans SC, sans-serif"
        font-size="26" font-weight="700" fill="#26364F">色彩系统</text>
  <text x="920" y="88" text-anchor="end" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"
        font-size="13" fill="#26364F" opacity=".55">5 主色 · 3 辅助色</text>

  <g>
    <rect x="40" y="124" width="152" height="176" rx="14" fill="#26364F"/>
    <rect x="216" y="124" width="152" height="176" rx="14" fill="#2E7D77"/>
    <rect x="392" y="124" width="152" height="176" rx="14" fill="#79B473"/>
    <rect x="568" y="124" width="152" height="176" rx="14" fill="#E9793B"/>
    <rect x="744" y="124" width="152" height="176" rx="14" fill="#F4ECDD" stroke="#E6DFD1" stroke-width="2"/>
  </g>

  <g font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans SC, sans-serif">
    <g font-size="17" font-weight="700" fill="#26364F">
      <text x="40" y="332">墨蓝</text><text x="216" y="332">河青</text><text x="392" y="332">荷绿</text>
      <text x="568" y="332">柿橘</text><text x="744" y="332">宣米</text>
    </g>
    <g font-size="11.5" letter-spacing="2.4" fill="#26364F" opacity=".55">
      <text x="40" y="354">INK</text><text x="216" y="354">CANAL TEAL</text><text x="392" y="354">LOTUS GREEN</text>
      <text x="568" y="354">PERSIMMON</text><text x="744" y="354">RICE PAPER</text>
    </g>
    <g font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600" fill="#26364F">
      <text x="40" y="380">#26364F</text><text x="216" y="380">#2E7D77</text><text x="392" y="380">#79B473</text>
      <text x="568" y="380">#E9793B</text><text x="744" y="380">#F4ECDD</text>
    </g>
    <g font-size="11.5" fill="#26364F" opacity=".5">
      <text x="40" y="402">文字 · 深色块</text><text x="216" y="402">主品牌 · 河道</text>
      <text x="392" y="402">自然 · 小荷</text><text x="568" y="402">强调 · 活力</text>
      <text x="744" y="402">底色 · 纸张</text>
    </g>
  </g>

  <g>
    <text x="40" y="446" font-family="Helvetica Neue, Arial, sans-serif" font-size="11"
          font-weight="700" letter-spacing="2.6" fill="#26364F" opacity=".55">COLOUR RATIO</text>
    <clipPath id="bar"><rect x="40" y="458" width="880" height="22" rx="11"/></clipPath>
    <g clip-path="url(#bar)">
      <rect x="40" y="458" width="528" height="22" fill="#F4ECDD"/>
      <rect x="568" y="458" width="132" height="22" fill="#2E7D77"/>
      <rect x="700" y="458" width="88" height="22" fill="#79B473"/>
      <rect x="788" y="458" width="88" height="22" fill="#26364F"/>
      <rect x="876" y="458" width="44" height="22" fill="#E9793B"/>
    </g>
    <rect x="40" y="458" width="880" height="22" rx="11" fill="none" stroke="#E6DFD1" stroke-width="1.5"/>
    <g font-family="Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#26364F" opacity=".6">
      <text x="304" y="473" text-anchor="middle">60%</text>
      <text x="634" y="473" text-anchor="middle" fill="#FFFFFF" opacity=".95">15%</text>
      <text x="744" y="473" text-anchor="middle" fill="#FFFFFF" opacity=".95">10%</text>
      <text x="832" y="473" text-anchor="middle" fill="#FFFFFF" opacity=".95">10%</text>
      <text x="898" y="473" text-anchor="middle" fill="#FFFFFF" opacity=".95">5%</text>
    </g>
  </g>
</svg>
