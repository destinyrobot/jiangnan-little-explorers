<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="江南小小探索家 字体系统">
  <title>字体系统 / Typography</title>
  <rect width="960" height="520" fill="#FFFFFF"/>
  <text x="40" y="52" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700"
        letter-spacing="3.4" fill="#2E7D77">TYPOGRAPHY</text>
  <text x="40" y="88" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans SC, sans-serif"
        font-size="26" font-weight="700" fill="#26364F">字体系统</text>
  <text x="920" y="88" text-anchor="end" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"
        font-size="13" fill="#26364F" opacity=".55">系统字体栈 · 无外部字体依赖</text>
  <path d="M40 108h880" stroke="#EAEAEA" stroke-width="2"/>

  <!-- 01 中文标题 -->
  <g>
    <text x="40" y="152" font-family="Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="700"
          letter-spacing="2.6" fill="#2E7D77">01 / CHINESE DISPLAY</text>
    <text x="40" y="204" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans SC, sans-serif"
          font-size="46" font-weight="700" letter-spacing="4" fill="#26364F">江南小小探索家</text>
    <text x="40" y="238" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans SC, sans-serif"
          font-size="17" fill="#26364F" opacity=".72">苹方 PingFang SC · Bold / Regular　水乡 · 园林 · 古桥 · 研学</text>
    <path d="M40 262h880" stroke="#EAEAEA" stroke-width="2"/>
  </g>

  <!-- 02 西文标题 -->
  <g>
    <text x="40" y="304" font-family="Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="700"
          letter-spacing="2.6" fill="#2E7D77">02 / LATIN DISPLAY</text>
    <text x="40" y="352" font-family="Helvetica Neue, Arial, sans-serif" font-size="44" font-weight="700"
          letter-spacing="-0.5" fill="#26364F">Little Explorers</text>
    <text x="40" y="384" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" letter-spacing="3.4"
          fill="#26364F" opacity=".72">HELVETICA NEUE · ABCDEFGHIJKLMNOPQRSTUVWXYZ 0123456789</text>
    <path d="M40 408h880" stroke="#EAEAEA" stroke-width="2"/>
  </g>

  <!-- 03 衬线点缀 + 字号 -->
  <g>
    <text x="40" y="450" font-family="Helvetica Neue, Arial, sans-serif" font-size="11.5" font-weight="700"
          letter-spacing="2.6" fill="#2E7D77">03 / ACCENT &amp; SCALE</text>
    <text x="40" y="492" font-family="Georgia, Times New Roman, serif" font-style="italic" font-size="30"
          fill="#26364F">Jiangnan Study Tour</text>
    <g font-family="Helvetica Neue, Arial, sans-serif" fill="#26364F">
      <text x="470" y="486" font-size="12" opacity=".5" letter-spacing="2">H1 48</text>
      <text x="560" y="486" font-size="12" opacity=".5" letter-spacing="2">H2 32</text>
      <text x="650" y="486" font-size="12" opacity=".5" letter-spacing="2">BODY 16</text>
      <text x="745" y="486" font-size="12" opacity=".5" letter-spacing="2">CAPTION 12</text>
      <text x="920" y="486" font-size="12" opacity=".5" letter-spacing="2" text-anchor="end">LABEL 11</text>
    </g>
    <g font-family="PingFang SC, Helvetica Neue, sans-serif" fill="#26364F">
      <text x="470" y="508" font-size="11" opacity=".45">行高 1.7 · 字距 0.02em</text>
      <text x="745" y="508" font-size="11" opacity=".45">全大写 + 字距 0.18em</text>
    </g>
  </g>
</svg>
